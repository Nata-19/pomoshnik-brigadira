services:
  - type: web
    name: pomoshnik-brigadira
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: INVENTORY_PATH
        value: /etc/secrets/inventory.json
